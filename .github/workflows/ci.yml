name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:raw-bridge
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: docker compose up -d --build
        env:
          OPENBROWSE_API_KEYS: dev-key
          OPENBROWSE_ENCRYPTION_KEY: ci-test-key-with-sufficient-length-value
          OPENBROWSE_CHROMIUM_SANDBOX: "true"
      - run: for i in {1..60}; do curl --fail --silent http://127.0.0.1:3000/healthz && exit 0; sleep 1; done; exit 1
      - run: npm run verify:docker
      - run: npm run benchmark:soak > benchmark-smoke.json
        env:
          OPENBROWSE_BENCHMARK_API_KEY: dev-key
          OPENBROWSE_BENCHMARK_TARGET: https://example.com
          OPENBROWSE_BENCHMARK_REQUESTS: "20"
          OPENBROWSE_BENCHMARK_CONCURRENCY: "2"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: benchmark-smoke.json
          if-no-files-found: error
      - run: "! docker compose logs --no-color openbrowse | grep -- '--no-sandbox'"
        env:
          OPENBROWSE_API_KEYS: dev-key
          OPENBROWSE_ENCRYPTION_KEY: ci-test-key-with-sufficient-length-value
          OPENBROWSE_CHROMIUM_SANDBOX: "true"
      - if: always()
        run: docker compose logs --no-color openbrowse
        env:
          OPENBROWSE_API_KEYS: dev-key
          OPENBROWSE_ENCRYPTION_KEY: ci-test-key-with-sufficient-length-value
          OPENBROWSE_CHROMIUM_SANDBOX: "true"
      - if: always()
        run: docker compose down --volumes --remove-orphans
        env:
          OPENBROWSE_API_KEYS: dev-key
          OPENBROWSE_ENCRYPTION_KEY: ci-test-key-with-sufficient-length-value
          OPENBROWSE_CHROMIUM_SANDBOX: "true"
